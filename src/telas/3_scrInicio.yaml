                Control: Label@2.5.1
                Properties:
                  X: =54
                  Y: =0
                  Width: =120
                  Height: =Parent.TemplateHeight
                  Size: =10
                  Color: =corTexto
                  Text: =If(ThisItem.Email = nfEu, "Você", ThisItem.Nome)
