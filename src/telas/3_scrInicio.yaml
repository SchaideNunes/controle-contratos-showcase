                Control: Rectangle@2.3.0
                Properties:
                  X: =180
                  Y: =16
                  Width: =Parent.TemplateWidth - 180 - 96
                  Height: =8
                  Fill: =ColorValue("#EEF1F3")
            - recEqBarra:
                Control: Rectangle@2.3.0
                Properties:
                  X: =180
                  Y: =16
                  Width: =(Parent.TemplateWidth - 180 - 96) * ThisItem.Pct
                  Height: =8
                  Fill: =corPrimaria
                  Visible: =ThisItem.Abertas > 0
            - recEqBarraAtr:
                Control: Rectangle@2.3.0
                Properties:
                  X: =180
                  Y: =16
                  Width: =(Parent.TemplateWidth - 180 - 96) * ThisItem.Pct * If(ThisItem.Abertas = 0, 0, ThisItem.Atr / ThisItem.Abertas)
                  Height: =8
                  Fill: =corVermelho
                  Visible: =ThisItem.Atr > 0
            - lblEqQtd:
                Control: Label@2.5.1
                Properties:
                  X: =Parent.TemplateWidth - 90
                  Y: =0
                  Width: =72
                  Height: =Parent.TemplateHeight
                  Align: =Align.Right
                  Size: =9
                  Color: =If(ThisItem.Atr > 0, corVermelho, corTextoMedio)
                  Text: =ThisItem.Abertas & If(ThisItem.Atr > 0, "  ·  " & ThisItem.Atr & " atr.", "")
      - lblEqSemResp:
          Control: Label@2.5.1
          Properties:
            X: =18
            Y: =Parent.Height - 38
            Width: =Parent.Width - 36
            Height: =28
            Size: =9
            FontWeight: =FontWeight.Semibold
            Color: =corVermelho
            Text: |-
              ="Sem responsável: " & CountRows(Filter(nfSol, !Fechada && RespNome = "Sem responsável"))
            Visible: =CountRows(Filter(nfSol, !Fechada && RespNome = "Sem responsável")) > 0
