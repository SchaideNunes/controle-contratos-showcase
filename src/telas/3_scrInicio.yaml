                  FontWeight: =FontWeight.Bold
                  Fill: =If(ThisItem.Email = nfEu, corPrimaria, corPrimariaClara)
                  HoverFill: =Self.Fill
                  PressedFill: =Self.Fill
                  Color: =If(ThisItem.Email = nfEu, Color.White, corPrimariaEsc)
                  HoverColor: =Self.Color
                  BorderThickness: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
