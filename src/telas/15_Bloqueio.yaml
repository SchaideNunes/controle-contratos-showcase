- conBloqueio:
    Control: GroupContainer@1.3.0
    Variant: ManualLayout
    Properties:
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =Parent.Height
      Visible: =!nfEhEquipe
      Fill: =Color.White
    Children:
      - lblBloqTitulo:
          Control: Label@2.5.1
          Properties:
            X: =Parent.Width / 2 - 260
            Y: =Parent.Height / 2 - 70
            Width: =520
            Height: =40
            Align: =Align.Center
            Size: =18
            FontWeight: =FontWeight.Semibold
            Color: =corTexto
            Text: ="Acesso restrito à equipe de contratos"
      - lblBloqTexto:
          Control: Label@2.5.1
          Properties:
            X: =Parent.Width / 2 - 260
            Y: =Parent.Height / 2 - 28
            Width: =520
            Height: =44
            Align: =Align.Center
            Size: =11
            Color: =corSuave
            Text: ="Esta tela é do painel da equipe. Use \"Minhas solicitações\" para acompanhar seus pedidos."
      - btnBloqVoltar:
          Control: Classic/Button@2.2.0
          Properties:
            X: =Parent.Width / 2 - 100
            Y: =Parent.Height / 2 + 30
            Width: =200
            Height: =40
            Text: ="Ir para Minhas solicitações"
            Size: =11
            Fill: =corPrimaria
            HoverFill: =corPrimariaEsc
            PressedFill: =corPrimariaEsc
            Color: =Color.White
            HoverColor: =Color.White
            BorderThickness: =0
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            OnSelect: =Navigate(scrMinhas, ScreenTransition.None)
