            Text: ="Concluídas"
      - galInMeses:
          Control: Gallery@2.15.0
          Variant: Horizontal
          Properties:
            X: =12
            Y: =90
            Width: =Parent.Width - 24
            Height: =Parent.Height - 90 - 12
            TemplateSize: =Self.Width / 6
            TemplatePadding: =0
            ShowScrollbar: =false
            Items: |-
              =With(
                  {b: Filter(nfSol,
                      IsBlank(cbInTipo.Selected.Value) || TipoTxt = cbInTipo.Selected.Value,
                      IsBlank(cbInResp.Selected.Value) || RespNome = cbInResp.Selected.Value
                  )},
                  With(
                      {t: ForAll(Sequence(6),
                          With({m: DateAdd(Date(Year(Today()), Month(Today()), 1), Value - 6, TimeUnit.Months)},
                              {
                                  Nome: Text(m, "mmm", "pt-BR"),
                                  R: CountRows(Filter(b, DtReceb >= m && DtReceb < DateAdd(m, 1, TimeUnit.Months))),
                                  C: CountRows(Filter(b, StatusTxt = "Concluída" && DtConcl >= m && DtConcl < DateAdd(m, 1, TimeUnit.Months)))
                              }
                          )
                      )},
                      AddColumns(t, Mx, Max(1, Max(t, R), Max(t, C)))
                  )
              )
          Children:
            - lblInMesR:
                Control: Label@2.5.1
                Properties:
                  X: =Parent.TemplateWidth / 2 - 30
                  Y: =Parent.TemplateHeight - 30 - 20 - (Parent.TemplateHeight - 80) * ThisItem.R / ThisItem.Mx
