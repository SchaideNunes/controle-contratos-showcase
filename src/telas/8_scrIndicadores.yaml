          Variant: Vertical
          Properties:
            X: =0
            Y: =82
            Width: =Parent.Width
            Height: =Parent.Height - 82 - 44
            TemplateSize: =50
            TemplatePadding: =0
            Items: |-
              =With(
                  {b2: AddColumns(
                      Filter(nfSol,
                          IsBlank(cbInTipo.Selected.Value) || TipoTxt = cbInTipo.Selected.Value,
                          IsBlank(cbInResp.Selected.Value) || RespNome = cbInResp.Selected.Value
                      ),
                      Cat, Coalesce(Switch(Coalesce(varIndCat, "Tipo"), "Tipo", TipoTxt, "Área", AreaTxt, "Opex/Capex", ClassTxt, "Responsável", RespNome, PrioTxt), "(sem valor)")
                  )},
                  With(
                      {t: AddColumns(Distinct(b2, Cat),
                          Rec, CountRows(Filter(b2, Cat = Value && DtReceb >= varIndIni)),
                          Ab, CountRows(Filter(b2, Cat = Value && !Fechada)),
                          Atr, CountRows(Filter(b2, Cat = Value && Atrasada)),
                          Conc, CountRows(Filter(b2, Cat = Value && StatusTxt = "Concluída" && DtConcl >= varIndIni)),
                          NoPrz, CountRows(Filter(b2, Cat = Value && StatusTxt = "Concluída" && DtConcl >= varIndIni && NoPrazo)),
                          Tempo, IfError(Average(Filter(b2, Cat = Value && StatusTxt = "Concluída" && DtConcl >= varIndIni), DiasAtend), 0)
                      )},
                      SortByColumns(
                          AddColumns(Filter(t, Rec > 0 || Ab > 0), Pct, If(Max(t, Ab) = 0, 0, Ab / Max(t, Ab))),
                          "Ab", SortOrder.Descending,
                          "Rec", SortOrder.Descending
                      )
                  )
              )
          Children:
            - lblInCpNome:
