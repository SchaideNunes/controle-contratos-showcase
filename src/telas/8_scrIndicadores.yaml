- galInKpis:
    Control: Gallery@2.15.0
    Variant: Horizontal
    Properties:
      X: =252
      Y: =146
      Width: =Parent.Width - 252 - 20
      Height: =96
      TemplateSize: =Self.Width / 6
      TemplatePadding: =0
      ShowScrollbar: =false
      Items: |-
        =With(
            {b: Filter(nfSol,
                IsBlank(cbInTipo.Selected.Value) || TipoTxt = cbInTipo.Selected.Value,
                IsBlank(cbInResp.Selected.Value) || RespNome = cbInResp.Selected.Value
            )},
            With(
                {
                    abertas: Filter(b, !Fechada),
                    atr: Filter(b, Atrasada),
                    rec: Filter(b, DtReceb >= varIndIni),
                    conc: Filter(b, StatusTxt = "Concluída" && DtConcl >= varIndIni)
                },
                Table(
                    {Titulo: "Em aberto", Valor: Text(CountRows(abertas)), Detalhe: CountRows(Filter(abertas, RespNome = "Sem responsável")) & " sem responsável", Tipo: "normal"},
                    {Titulo: "Atrasadas", Valor: Text(CountRows(atr)), Detalhe: If(IsEmpty(abertas), "—", Text(CountRows(atr) / CountRows(abertas), "0%") & " das abertas"), Tipo: If(CountRows(atr) > 0, "alerta", "normal")},
                    {Titulo: "Recebidas", Valor: Text(CountRows(rec)), Detalhe: "no período", Tipo: "normal"},
                    {Titulo: "Concluídas", Valor: Text(CountRows(conc)), Detalhe: "no período", Tipo: "normal"},
                    {Titulo: "Concluídas no prazo", Valor: If(IsEmpty(conc), "—", Text(CountRows(Filter(conc, NoPrazo)) / CountRows(conc), "0%")), Detalhe: CountRows(Filter(conc, NoPrazo)) & " de " & CountRows(conc) & " concluídas", Tipo: "verde"},
                    {Titulo: "Tempo médio", Valor: If(IsEmpty(conc), "—", Text(IfError(Average(conc, DiasAtend), 0), "0.0") & " d"), Detalhe: "do recebimento à conclusão", Tipo: "normal"}
                )
            )
        )
    Children:
      - recInKpi:
          Control: Rectangle@2.3.0
          Properties:
            X: =0
            Y: =0
            Width: =Parent.TemplateWidth - 10
            Height: =Parent.TemplateHeight
            Fill: =If(ThisItem.Tipo = "alerta", corVermelhoBg, Color.White)
            BorderColor: =If(ThisItem.Tipo = "alerta", corVermelhoBorda, corBorda)
            BorderThickness: =1
      - lblInKpiTitulo:
          Control: Label@2.5.1
          Properties:
            X: =14
            Y: =10
            Width: =Parent.TemplateWidth - 38
            Height: =22
            Size: =9
            Color: =If(ThisItem.Tipo = "alerta", corVermelho, corTextoMedio)
            Text: =ThisItem.Titulo
      - lblInKpiValor:
          Control: Label@2.5.1
          Properties:
            X: =14
            Y: =30
            Width: =Parent.TemplateWidth - 38
            Height: =40
            Size: =20
            FontWeight: =FontWeight.Semibold
            Color: =Switch(ThisItem.Tipo, "alerta", corVermelho, "verde", corVerde, corTexto)
            Text: =ThisItem.Valor
      - lblInKpiDetalhe:
          Control: Label@2.5.1
          Properties:
            X: =14
            Y: =68
            Width: =Parent.TemplateWidth - 38
            Height: =20
            Size: =8
            Color: =If(ThisItem.Tipo = "alerta", corVermelho, corSuave)
            Text: =ThisItem.Detalhe
