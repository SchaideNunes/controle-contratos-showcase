                  Height: =20
                  Align: =Align.Center
                  Size: =8
                  Color: =corTextoMedio
                  Text: =ThisItem.C
            - recInMesC:
                Control: Rectangle@2.3.0
                Properties:
                  X: =Parent.TemplateWidth / 2 + 4
                  Y: =Parent.TemplateHeight - 30 - Max(2, (Parent.TemplateHeight - 80) * ThisItem.C / ThisItem.Mx)
                  Width: =24
                  Height: =Max(2, (Parent.TemplateHeight - 80) * ThisItem.C / ThisItem.Mx)
                  Fill: =ColorValue("#C27A2C")
            - recInMesBase:
                Control: Rectangle@2.3.0
                Properties:
                  X: =0
                  Y: =Parent.TemplateHeight - 30
                  Width: =Parent.TemplateWidth
                  Height: =1
                  Fill: =corBordaForte
            - lblInMesNome:
                Control: Label@2.5.1
                Properties:
                  X: =0
                  Y: =Parent.TemplateHeight - 28
                  Width: =Parent.TemplateWidth
                  Height: =24
                  Align: =Align.Center
                  Size: =9
                  Color: =corSuave
                  Text: =ThisItem.Nome
