          Properties:
            X: =24
            Y: =72
            Width: =Parent.Width - 48
            Height: =20
            Size: =8
            Color: =If(varTd.Atrasada, corVermelho, corSuave)
            Text: =If(varTd.Atrasada, "Atrasada há " & varTd.DiasAtraso & " dia(s)  ·  ", "") & varTd.TipoTxt & "  ·  " & varTd.AreaTxt
      - htmlTpDados:
          Control: HtmlViewer@2.1.0
          Properties:
            X: =14
            Y: =96
            Width: =Parent.Width - 28
            Height: =250
            HtmlText: |-
              ="<div style='font-family:Segoe UI,sans-serif;font-size:12px;color:#1F2933'><table style='width:100%;border-collapse:collapse'>" &
              Concat(
                  Table(
                      {k: "Solicitante", v: varTd.SolNome},
                      {k: "Fiscal", v: varTd.FiscalNome},
                      {k: "Classificação", v: varTd.ClassTxt},
                      {k: "Responsável", v: varTd.RespNome},
                      {k: "Prioridade", v: varTd.PrioTxt},
                      {k: "Recebida em", v: Text(varTd.DtReceb, "dd/mm/yyyy")},
                      {k: "Prazo solicitado", v: Text(varTd.PrazoSolicitado, "dd/mm/yyyy")},
                      {k: "Prazo acordado", v: Text(varTd.PrazoAcordado, "dd/mm/yyyy")},
                      {k: "Concluída em", v: Text(varTd.DtConcl, "dd/mm/yyyy") & If(IsBlank(varTd.DtConcl), "", If(varTd.NoPrazo, " (no prazo)", " (após o prazo)"))},
                      {k: "Justificativa", v: varTd.JustifTxt},
                      {k: "Orientação", v: varTd.Orientacao},
                      {k: "Aguardando", v: varTd.MotivoAguardando},
                      {k: "Motivo da recusa", v: varTd.MotivoRecusa},
                      {k: "Nº contrato", v: varTd.NumeroContrato},
                      {k: "Fornecedor", v: varTd.Fornecedor}
                  ),
                  If(IsBlank(v), "",
                      "<tr><td style='padding:5px 0;color:#5F6B76;width:34%;vertical-align:top;border-bottom:1px solid #EEF1F3'>" & k &
                      "</td><td style='padding:5px 0;border-bottom:1px solid #EEF1F3'>" & v & "</td></tr>")
              ) &
              "</table></div>"
      - lblTpRotHist:
          Control: Label@2.5.1
          Properties:
            X: =24
            Y: =354
            Width: =Parent.Width - 48
            Height: =20
            Size: =8
