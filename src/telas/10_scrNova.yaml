- lblNvFaltando:
    Control: Label@2.5.1
    Properties:
      X: =Parent.Width - 32 - 300
      Y: =306
      Width: =300
      Height: =Parent.Height - 306 - 12 - 40 - 10 - 46 - 14
      Size: =9
      VerticalAlign: =VerticalAlign.Top
      Color: =ColorValue("#6B4E00")
      Fill: =ColorValue("#FDF6E7")
      BorderColor: =ColorValue("#F0D9A8")
      BorderThickness: =1
      PaddingLeft: =14
      PaddingRight: =14
      PaddingTop: =12
      Text: |-
        =With(
            {falta: Filter(
                Table(
                    {Campo: "Área solicitante", Ok: If(varNvAreaOutra, !IsBlank(Trim(txtNvAreaOutra.Text)), !IsBlank(cbNvArea.Selected.Value))},
                    {Campo: "Tipo de demanda", Ok: If(varNvTipoOutro, !IsBlank(Trim(txtNvTipoOutro.Text)), !IsBlank(cbNvTipo.Selected.Value))},
                    {Campo: "Classificação Opex ou Capex", Ok: !IsBlank(varNvClass)},
                    {Campo: "Fiscal do serviço (ou marcar N/A)", Ok: chkNvFiscalNA.Value || !IsBlank(cbNvFiscal.Selected.Mail)},
                    {Campo: "Descrição", Ok: !IsBlank(Trim(txtNvDesc.Text))},
                    {Campo: "Prazo desejado (hoje ou depois)", Ok: !IsBlank(dpNvPrazo.SelectedDate) && dpNvPrazo.SelectedDate >= Today()},
                    {Campo: "Justificativa do prazo", Ok: !IsBlank(Trim(txtNvJust.Text))},
                    {Campo: "Pelo menos um documento anexado", Ok: CountRows(attNova.Attachments) > 0},
                    {Campo: "Prioridade", Ok: !IsBlank(varNvPrio)}
                ),
                !Ok
            )},
            If(IsEmpty(falta),
                "Tudo pronto. Pode enviar.",
                "Falta preencher:" & Char(10) & Concat(falta, "•  " & Campo, Char(10))
            )
        )
- btnNvEnviar:
    Control: Classic/Button@2.2.0
    Properties:
      X: =Parent.Width - 32 - 300
      Y: =Parent.Height - 12 - 40 - 10 - 46
      Width: =300
      Height: =46
      Text: =If(varNvEnviando, "Enviando…", "Enviar solicitação")
      Size: =11
      FontWeight: =FontWeight.Semibold
      Fill: =corPrimaria
      HoverFill: =corPrimariaEsc
      PressedFill: =corPrimariaEsc
      Color: =Color.White
      HoverColor: =Color.White
      DisabledFill: =corBordaForte
      DisabledColor: =Color.White
      BorderThickness: =0
      RadiusTopLeft: =6
      RadiusTopRight: =6
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      DisplayMode: =If(varNvEnviando || lblNvFaltando.Text <> "Tudo pronto. Pode enviar.", DisplayMode.Disabled, DisplayMode.Edit)
      OnSelect: |-
        =Set(varNvEnviando, true);
        Set(varNvDados, {
            tipo: If(varNvTipoOutro, Trim(txtNvTipoOutro.Text), cbNvTipo.Selected.Value),
            area: If(varNvAreaOutra, Trim(txtNvAreaOutra.Text), cbNvArea.Selected.Value),
            fiscalNA: chkNvFiscalNA.Value,
            fiscalNome: cbNvFiscal.Selected.DisplayName,
            fiscalMail: Lower(cbNvFiscal.Selected.Mail),
            desc: Trim(txtNvDesc.Text),
            prazo: dpNvPrazo.SelectedDate,
            just: Trim(txtNvJust.Text),
            prio: varNvPrio,
            classe: varNvClass
        });
        SubmitForm(frmAnexo)
- btnNvCancelar:
