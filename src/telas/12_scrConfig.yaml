- recCfLinha:
    Control: Rectangle@2.3.0
    Properties:
      X: =220
      Y: =84
      Width: =Parent.Width - 220
      Height: =1
      Fill: =corBorda
- conCfEquipe:
    Control: GroupContainer@1.3.0
    Variant: ManualLayout
    Properties:
      X: =252
      Y: =100
      Width: =(Parent.Width - 284 - 14) * 0.64
      Height: =Parent.Height - 100 - 16
      Fill: =Color.White
      BorderColor: =corBorda
      BorderThickness: =1
      RadiusTopLeft: =8
      RadiusTopRight: =8
      RadiusBottomLeft: =8
      RadiusBottomRight: =8
    Children:
      - lblCfEqTitulo:
          Control: Label@2.5.1
          Properties:
            X: =20
            Y: =12
            Width: =Parent.Width - 40
            Height: =28
            Size: =12
            FontWeight: =FontWeight.Semibold
            Color: =corTexto
            Text: ="Equipe de contratos"
      - lblCfRotBusca:
          Control: Label@2.5.1
          Properties:
            X: =20
            Y: =44
            Width: =300
            Height: =20
            Size: =8
            FontWeight: =FontWeight.Semibold
            Color: =corSuave
            Text: ="ADICIONAR PESSOA"
      - cbCfPessoa:
          Control: Classic/ComboBox@2.4.0
          Properties:
            X: =20
            Y: =66
            Width: =Parent.Width - 20 - 12 - 150 - 12 - 130 - 20
            Height: =38
            Items: |-
              =If(Len(Self.SearchText) >= 3, Office365Users.SearchUserV2({searchTerm: Self.SearchText, top: 10}).value)
            SelectMultiple: =false
            IsSearchable: =true
            DisplayFields: =["DisplayName"]
            SearchFields: =["DisplayName"]
            InputTextPlaceholder: ="Digite pelo menos 3 letras do nome"
            DefaultSelectedItems: =Blank()
            Size: =10
            BorderColor: =corBordaForte
      - ddCfPapelNovo:
          Control: Classic/DropDown@2.3.1
          Properties:
            X: =Parent.Width - 20 - 130 - 12 - 150
            Y: =66
            Width: =150
            Height: =38
            Items: =["Analista", "Coordenador", "Gestor"]
            Default: ="Analista"
            Size: =10
            Fill: =Color.White
            Color: =corTexto
            BorderColor: =corBordaForte
            ChevronBackground: =Color.White
            ChevronFill: =corSuave
      - btnCfAdicionar:
          Control: Classic/Button@2.2.0
          Properties:
            X: =Parent.Width - 20 - 130
            Y: =66
            Width: =130
            Height: =38
            Text: ="Adicionar"
            Size: =10
            FontWeight: =FontWeight.Semibold
            Fill: =corPrimaria
            HoverFill: =corPrimariaEsc
            PressedFill: =corPrimariaEsc
            Color: =Color.White
            HoverColor: =Color.White
            DisabledFill: =corBordaForte
            DisabledColor: =Color.White
            BorderThickness: =0
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            DisplayMode: =If(IsBlank(cbCfPessoa.Selected.Mail), DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: |-
              =With(
                  {
                      p: cbCfPessoa.Selected,
                      existe: LookUp(EquipeContratos, Lower(Usuario.Email) = Lower(cbCfPessoa.Selected.Mail))
                  },
                  If(!IsBlank(existe),
                      If(existe.Ativo,
                          Notify(p.DisplayName & " já está na equipe", NotificationType.Warning),
                          Patch(EquipeContratos, existe, {Ativo: true, Papel: {Value: ddCfPapelNovo.Selected.Value}});
                          Notify(p.DisplayName & " foi reativado(a)", NotificationType.Success)
                      ),
                      Patch(EquipeContratos, Defaults(EquipeContratos), {
                          Title: First(Split(p.DisplayName, " ")).Value,
                          Usuario: {
                              Claims: "i:0#.f|membership|" & Lower(p.Mail),
                              DisplayName: p.DisplayName,
                              Email: Lower(p.Mail),
                              Department: "",
                              JobTitle: "",
                              Picture: ""
                          },
                          Papel: {Value: ddCfPapelNovo.Selected.Value},
                          Ativo: true,
                          Ordem: Coalesce(Max(EquipeContratos, Ordem), 0) + 1
                      });
                      Notify(p.DisplayName & " adicionado(a) como " & ddCfPapelNovo.Selected.Value, NotificationType.Success)
                  )
              );
              Reset(cbCfPessoa);
              Reset(ddCfPapelNovo);
              Refresh(EquipeContratos)
      - recCfCab:
          Control: Rectangle@2.3.0
          Properties:
            X: =0
            Y: =120
            Width: =Parent.Width
            Height: =32
            Fill: =ColorValue("#F5F7F9")
      - lblCfCabPessoa:
          Control: Label@2.5.1
          Properties:
            X: =84
            Y: =120
            Width: =200
            Height: =32
            Size: =8
            FontWeight: =FontWeight.Semibold
            Color: =corSuave
            Text: ="PESSOA"
      - lblCfCabPapel:
          Control: Label@2.5.1
          Properties:
            X: =Parent.Width - 20 - 120 - 12 - 90 - 12 - 160
            Y: =120
            Width: =160
            Height: =32
            Size: =8
            FontWeight: =FontWeight.Semibold
            Color: =corSuave
            Text: ="PAPEL"
      - lblCfCabCarga:
          Control: Label@2.5.1
          Properties:
            X: =Parent.Width - 20 - 120 - 12 - 90
            Y: =120
            Width: =90
            Height: =32
            Size: =8
            FontWeight: =FontWeight.Semibold
            Color: =corSuave
            Text: ="EM ABERTO"
      - galCfMembros:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            X: =0
            Y: =152
            Width: =Parent.Width
            Height: =Parent.Height - 152
            TemplateSize: =64
            TemplatePadding: =0
            Items: |-
              =AddColumns(
                  SortByColumns(EquipeContratos, "Ativo", SortOrder.Descending, "Ordem", SortOrder.Ascending),
                  NomeM, Usuario.DisplayName,
                  EmailM, Lower(Usuario.Email),
                  SouEu, Lower(Usuario.Email) = nfEu,
                  Abertas, CountRows(Filter(nfSol, !Fechada && RespEmail = Lower(Usuario.Email)))
              )
          Children:
            - btnCfOrdemSobe:
                Control: Classic/Icon@2.5.0
                Properties:
                  X: =14
                  Y: =10
                  Width: =24
                  Height: =22
                  PaddingTop: =3
                  PaddingBottom: =3
                  PaddingLeft: =3
                  PaddingRight: =3
                  Icon: =Icon.ChevronUp
                  Color: =corSuave
                  Tooltip: ="Subir na ordem"
                  Visible: =ThisItem.Ativo
                  OnSelect: |-
                    =With(
                        {acima: First(SortByColumns(Filter(EquipeContratos, Ativo && Ordem < ThisItem.Ordem), "Ordem", SortOrder.Descending))},
                        If(!IsBlank(acima),
                            Patch(EquipeContratos, LookUp(EquipeContratos, ID = acima.ID), {Ordem: ThisItem.Ordem});
                            Patch(EquipeContratos, LookUp(EquipeContratos, ID = ThisItem.ID), {Ordem: acima.Ordem});
                            Refresh(EquipeContratos)
                        )
                    )
            - btnCfOrdemDesce:
                Control: Classic/Icon@2.5.0
                Properties:
                  X: =14
                  Y: =32
                  Width: =24
                  Height: =22
                  PaddingTop: =3
                  PaddingBottom: =3
                  PaddingLeft: =3
                  PaddingRight: =3
                  Icon: =Icon.ChevronDown
                  Color: =corSuave
                  Tooltip: ="Descer na ordem"
                  Visible: =ThisItem.Ativo
                  OnSelect: |-
                    =With(
                        {abaixo: First(SortByColumns(Filter(EquipeContratos, Ativo && Ordem > ThisItem.Ordem), "Ordem", SortOrder.Ascending))},
                        If(!IsBlank(abaixo),
                            Patch(EquipeContratos, LookUp(EquipeContratos, ID = abaixo.ID), {Ordem: ThisItem.Ordem});
                            Patch(EquipeContratos, LookUp(EquipeContratos, ID = ThisItem.ID), {Ordem: abaixo.Ordem});
                            Refresh(EquipeContratos)
                        )
                    )
            - btnCfAvatar:
                Control: Classic/Button@2.2.0
                Properties:
                  X: =44
                  Y: =16
                  Width: =32
                  Height: =32
                  Text: =Upper(Left(ThisItem.NomeM, 1) & Left(Last(Split(ThisItem.NomeM, " ")).Value, 1))
                  Size: =8
                  FontWeight: =FontWeight.Bold
                  PaddingLeft: =0
                  PaddingRight: =0
                  Fill: =If(!ThisItem.Ativo, ColorValue("#EEF1F3"), ThisItem.SouEu, corPrimaria, corPrimariaClara)
                  HoverFill: =Self.Fill
                  PressedFill: =Self.Fill
                  Color: =If(!ThisItem.Ativo, corSuave, ThisItem.SouEu, Color.White, corPrimariaEsc)
                  HoverColor: =Self.Color
                  BorderThickness: =0
                  RadiusTopLeft: =16
                  RadiusTopRight: =16
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
            - lblCfNome:
                Control: Label@2.5.1
                Properties:
                  X: =84
                  Y: =10
                  Width: =Parent.TemplateWidth - 84 - 20 - 120 - 12 - 90 - 12 - 160 - 10
                  Height: =24
                  Size: =10
                  FontWeight: =FontWeight.Semibold
                  Color: =If(ThisItem.Ativo, corTexto, corSuave)
                  Text: =ThisItem.NomeM & If(ThisItem.SouEu, " (você)", "") & If(ThisItem.Ativo, "", "  ·  inativo")
            - lblCfEmail:
                Control: Label@2.5.1
                Properties:
                  X: =84
                  Y: =32
                  Width: =Parent.TemplateWidth - 84 - 20 - 120 - 12 - 90 - 12 - 160 - 10
                  Height: =20
                  Size: =8
                  Color: =corSuave
                  Text: =ThisItem.EmailM
            - ddCfPapel:
                Control: Classic/DropDown@2.3.1
                Properties:
                  X: =Parent.TemplateWidth - 20 - 120 - 12 - 90 - 12 - 160
                  Y: =14
                  Width: =160
                  Height: =36
                  Items: =["Coordenador", "Analista", "Gestor"]
                  Default: =ThisItem.Papel.Value
                  Size: =9
                  Fill: =Color.White
                  Color: =corTexto
                  BorderColor: =corBordaForte
                  ChevronBackground: =Color.White
                  ChevronFill: =corSuave
                  DisabledFill: =ColorValue("#F5F7F9")
                  DisabledColor: =corSuave
                  Tooltip: =If(ThisItem.SouEu, "Você não pode mudar o seu próprio papel", "")
                  DisplayMode: =If(ThisItem.SouEu || !ThisItem.Ativo, DisplayMode.Disabled, DisplayMode.Edit)
                  OnChange: |-
                    =If(Self.Selected.Value <> ThisItem.Papel.Value,
                        Patch(EquipeContratos, LookUp(EquipeContratos, ID = ThisItem.ID), {Papel: {Value: Self.Selected.Value}});
                        Refresh(EquipeContratos);
                        Notify(ThisItem.NomeM & " agora é " & Self.Selected.Value, NotificationType.Success)
                    )
            - lblCfCarga:
                Control: Label@2.5.1
                Properties:
                  X: =Parent.TemplateWidth - 20 - 120 - 12 - 90
                  Y: =0
                  Width: =90
                  Height: =Parent.TemplateHeight
                  Size: =10
                  Color: =If(!ThisItem.Ativo && ThisItem.Abertas > 0, corVermelho, corTexto)
                  Text: =ThisItem.Abertas
            - btnCfAtivo:
                Control: Classic/Button@2.2.0
                Properties:
                  X: =Parent.TemplateWidth - 20 - 120
                  Y: =14
                  Width: =120
                  Height: =36
                  Text: =If(ThisItem.Ativo, "Desativar", "Reativar")
                  Size: =9
                  Fill: =Color.White
                  HoverFill: =If(ThisItem.Ativo, corVermelhoBg, ColorValue("#EEF3F7"))
                  PressedFill: =Self.HoverFill
                  Color: =If(ThisItem.Ativo, corVermelho, corPrimaria)
                  HoverColor: =Self.Color
                  BorderColor: =If(ThisItem.Ativo, corVermelhoBorda, corBordaForte)
                  BorderThickness: =1
                  DisabledFill: =ColorValue("#F5F7F9")
                  DisabledColor: =corSuave
                  DisabledBorderColor: =corBorda
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  Tooltip: =If(ThisItem.SouEu, "Você não pode desativar a si mesmo", "")
                  DisplayMode: =If(ThisItem.SouEu, DisplayMode.Disabled, DisplayMode.Edit)
                  OnSelect: |-
                    =If(ThisItem.Ativo,
                        Set(varCfDesativar, ThisItem);
                        Set(varCfModal, true),
                        Patch(EquipeContratos, LookUp(EquipeContratos, ID = ThisItem.ID), {
                            Ativo: true,
                            Ordem: Coalesce(Max(Filter(EquipeContratos, Ativo), Ordem), 0) + 1
                        });
                        Refresh(EquipeContratos);
                        Notify(ThisItem.NomeM & " foi reativado(a)", NotificationType.Success)
                    )
            - recCfSep:
                Control: Rectangle@2.3.0
                Properties:
                  X: =0
                  Y: =Parent.TemplateHeight - 1
                  Width: =Parent.TemplateWidth
                  Height: =1
                  Fill: =ColorValue("#EEF1F3")
- conCfInfo:
    Control: GroupContainer@1.3.0
    Variant: ManualLayout
    Properties:
      X: =252 + (Parent.Width - 284 - 14) * 0.64 + 14
      Y: =100
      Width: =Parent.Width - 32 - (252 + (Parent.Width - 284 - 14) * 0.64 + 14)
      Height: =Parent.Height - 100 - 16
      Fill: =Color.White
      BorderColor: =corBorda
      BorderThickness: =1
      RadiusTopLeft: =8
      RadiusTopRight: =8
      RadiusBottomLeft: =8
      RadiusBottomRight: =8
    Children:
      - htmlCfPapeis:
          Control: HtmlViewer@2.1.0
          Properties:
            X: =8
            Y: =8
            Width: =Parent.Width - 16
            Height: =Parent.Height - 16
            HtmlText: |-
              ="<div style='font-family:Segoe UI,sans-serif;font-size:12px;color:#1F2933;line-height:1.5'>" &
              "<div style='font-size:15px;font-weight:600;margin-bottom:10px'>Como funcionam os papéis</div>" &
              "<p style='margin:0 0 4px'><b>Coordenador</b></p>" &
              "<p style='margin:0 0 12px;color:#3E4C59'>Vê tudo, faz a triagem, atribui e repassa solicitações, altera prazos direto, aprova pedidos de alteração e acessa esta tela. Recebe o e-mail de cada nova solicitação.</p>" &
              "<p style='margin:0 0 4px'><b>Analista</b></p>" &
              "<p style='margin:0 0 12px;color:#3E4C59'>Vê tudo e cuida das solicitações atribuídas a ele: muda status, conclui e manda mensagens ao solicitante. Para mudar o prazo, faz um pedido que vai para a aprovação da coordenação.</p>" &
              "<p style='margin:0 0 4px'><b>Gestor</b></p>" &
              "<p style='margin:0 0 12px;color:#3E4C59'>Acompanha o painel e os indicadores, sem alterar as solicitações. Não aparece como opção para receber demandas.</p>" &
              "<p style='margin:0 0 4px'><b>Quem não está na lista</b></p>" &
              "<p style='margin:0 0 16px;color:#3E4C59'>É tratado como solicitante: só vê as próprias solicitações e cria novas.</p>" &
              "<div style='border-top:1px solid #E1E6EA;padding-top:12px;font-size:15px;font-weight:600;margin-bottom:8px'>Opções das listas</div>" &
              "<p style='margin:0;color:#3E4C59'>Tipos de demanda, áreas e prioridades são as opções das colunas no Lists. Para incluir ou mudar uma opção, edite a coluna em <b>SolicitacoesContrato</b> no SharePoint. O app passa a mostrar a novidade no próximo carregamento.</p>" &
              "</div>"
- recCfModalFundo:
    Control: Rectangle@2.3.0
    Properties:
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =Parent.Height
      Fill: =RGBA(23, 33, 43, 0.45)
      Visible: =varCfModal
      OnSelect: =Set(varCfModal, false)
- conCfDesativar:
    Control: GroupContainer@1.3.0
    Variant: ManualLayout
    Properties:
      X: =(Parent.Width - 480) / 2
      Y: =(Parent.Height - 250) / 2
      Width: =480
      Height: =250
      Fill: =Color.White
      DropShadow: =DropShadow.ExtraBold
      RadiusTopLeft: =10
      RadiusTopRight: =10
      RadiusBottomLeft: =10
      RadiusBottomRight: =10
      Visible: =varCfModal
    Children:
      - lblCfDsTitulo:
          Control: Label@2.5.1
          Properties:
            X: =24
            Y: =18
            Width: =Parent.Width - 48
            Height: =30
            Size: =14
            FontWeight: =FontWeight.Semibold
            Color: =corTexto
            Text: ="Desativar " & varCfDesativar.NomeM & "?"
      - lblCfDsTexto:
          Control: Label@2.5.1
          Properties:
            X: =24
            Y: =54
            Width: =Parent.Width - 48
            Height: =110
            Size: =10
            VerticalAlign: =VerticalAlign.Top
            Color: =corTextoMedio
            Text: |-
              =varCfDesativar.NomeM & " deixa de aparecer na Distribuição e na lista de quem pode receber solicitações, e passa a ver o app como solicitante." &
              If(varCfDesativar.Abertas > 0,
                  Char(10) & Char(10) & "Atenção: há " & varCfDesativar.Abertas & " solicitação(ões) em aberto com essa pessoa. Elas continuam com ela até você repassar na Distribuição.",
                  "")
      - btnCfDsCancelar:
          Control: Classic/Button@2.2.0
          Properties:
            X: =Parent.Width - 24 - 150 - 10 - 110
            Y: =Parent.Height - 62
            Width: =110
            Height: =40
            Text: ="Cancelar"
            Size: =10
            Fill: =Color.White
            HoverFill: =corColuna
            PressedFill: =corPrimariaClara
            Color: =corTexto
            HoverColor: =corTexto
            BorderColor: =corBordaForte
            BorderThickness: =1
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            OnSelect: =Set(varCfModal, false)
      - btnCfDsConfirmar:
          Control: Classic/Button@2.2.0
          Properties:
            X: =Parent.Width - 24 - 150
            Y: =Parent.Height - 62
            Width: =150
            Height: =40
            Text: ="Desativar"
            Size: =10
            FontWeight: =FontWeight.Semibold
            Fill: =corVermelho
            HoverFill: =ColorFade(corVermelho, -15%)
            PressedFill: =ColorFade(corVermelho, -25%)
            Color: =Color.White
            HoverColor: =Color.White
            BorderThickness: =0
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            OnSelect: |-
              =Patch(EquipeContratos, LookUp(EquipeContratos, ID = varCfDesativar.ID), {Ativo: false});
              Refresh(EquipeContratos);
              Set(varCfModal, false);
              Notify(varCfDesativar.NomeM & " foi desativado(a)", NotificationType.Success)
