- conDsRepassar:
    Control: GroupContainer@1.3.0
    Variant: ManualLayout
    Properties:
      X: =(Parent.Width - 460) / 2
      Y: =(Parent.Height - 440) / 2
      Width: =460
      Height: =440
      Fill: =Color.White
      DropShadow: =DropShadow.ExtraBold
      RadiusTopLeft: =10
      RadiusTopRight: =10
      RadiusBottomLeft: =10
      RadiusBottomRight: =10
      Visible: =varDsModal
    Children:
      - lblRpTitulo:
          Control: Label@2.5.1
          Properties:
            X: =24
            Y: =16
            Width: =Parent.Width - 80
            Height: =30
            Size: =14
            FontWeight: =FontWeight.Semibold
            Color: =corTexto
            Text: ="Repassar " & varDsCard.Codigo
      - icoRpFechar:
          Control: Classic/Icon@2.5.0
          Properties:
            X: =Parent.Width - 48
            Y: =16
            Width: =30
            Height: =30
            PaddingTop: =6
            PaddingBottom: =6
            PaddingLeft: =6
            PaddingRight: =6
            Icon: =Icon.Cancel
            Color: =corSuave
            OnSelect: =Set(varDsModal, false)
      - lblRpSub:
          Control: Label@2.5.1
          Properties:
            X: =24
            Y: =46
            Width: =Parent.Width - 48
            Height: =40
            Size: =9
            Color: =corSuave
            Text: =varDsCard.Desc & "  ·  hoje com " & varDsCard.RespNome
      - lblRpRot:
          Control: Label@2.5.1
          Properties:
            X: =24
            Y: =92
            Width: =Parent.Width - 48
            Height: =22
            Size: =9
            FontWeight: =FontWeight.Semibold
            Color: =corTexto
            Text: ="Passar para"
      - galRpPessoas:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            X: =24
            Y: =116
            Width: =Parent.Width - 48
            Height: =Parent.Height - 116 - 20
            TemplateSize: =58
            TemplatePadding: =0
            Items: =Filter(galDsEquipe.AllItems, Email <> varDsCard.RespEmail)
          Children:
            - btnRpPessoa:
                Control: Classic/Button@2.2.0
                Properties:
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth
                  Height: =50
                  Text: =""
                  Fill: =Color.White
                  HoverFill: =ColorValue("#EEF3F7")
                  PressedFill: =corPrimariaClara
                  BorderColor: =corBorda
                  BorderThickness: =1
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  OnSelect: |-
                    =With(
                        {
                            pessoa: ThisItem,
                            antigo: varDsCard.RespNome,
                            s: LookUp(SolicitacoesContrato, ID = varDsCard.ID),
                            resp: {
                                Claims: "i:0#.f|membership|" & ThisItem.Email,
                                DisplayName: ThisItem.Nome,
                                Email: ThisItem.Email,
                                Department: "",
                                JobTitle: "",
                                Picture: ""
                            }
                        },
                        Patch(SolicitacoesContrato, s,
                            If(varDsCard.StatusTxt = "Aguardando solicitante",
                                {Responsavel: resp},
                                {Responsavel: resp, ResponsavelProximaAcao: resp}
                            )
                        );
                        Patch(HistoricoSolicitacoes, Defaults(HistoricoSolicitacoes), {
                            Title: "Repassada de " & antigo & " para " & pessoa.Nome,
                            SolicitacaoID: varDsCard.ID,
                            Acao: {Value: "Atribuída"},
                            CampoAlterado: "Responsavel",
                            ValorAnterior: antigo,
                            ValorNovo: pessoa.Nome,
                            Usuario: nfEuPessoa,
                            DataHora: Now()
                        });
                        If(pessoa.Email <> nfEu,
                            Office365Outlook.SendEmailV2(
                                pessoa.Email,
                                "Solicitação repassada para você: " & varDsCard.Codigo & " · " & varDsCard.Desc,
                                "<div style='font-family:Segoe UI,sans-serif;font-size:14px;color:#1F2933'>" &
                                "<p>Olá, " & First(Split(pessoa.Nome, " ")).Value & ".</p>" &
                                "<p>A solicitação <b>" & varDsCard.Codigo & " · " & varDsCard.Desc & "</b> estava com " & antigo &
                                " e agora está com você. Status: " & varDsCard.StatusTxt & ". Prazo: <b>" & Text(varDsCard.DtPrazo, "dd/mm/yyyy") & "</b>.</p>" &
                                "<p style='color:#5F6B76'>" & User().FullName & "<br>Coordenação de Contratos</p></div>"
                            )
                        );
                        Refresh(SolicitacoesContrato);
                        Set(varDsModal, false);
                        Notify("Repassada para " & pessoa.Nome, NotificationType.Success)
                    )
            - lblRpNome:
                Control: Label@2.5.1
                Properties:
                  X: =14
                  Y: =4
                  Width: =Parent.TemplateWidth - 28
                  Height: =24
                  Size: =10
                  FontWeight: =FontWeight.Semibold
                  Color: =corTexto
                  Text: =ThisItem.Nome & If(ThisItem.Email = nfEu, " (você)", "")
                  OnSelect: =Select(btnRpPessoa)
            - lblRpCarga:
                Control: Label@2.5.1
                Properties:
                  X: =14
                  Y: =24
                  Width: =Parent.TemplateWidth - 28
                  Height: =20
                  Size: =8
                  Color: =corSuave
                  Text: =ThisItem.Abertas & " em aberto  ·  " & ThisItem.Atr & " atrasada(s)"
                  OnSelect: =Select(btnRpPessoa)
