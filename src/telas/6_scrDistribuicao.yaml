                  HoverColor: =Self.Color
                  Fill: =ThisItem.PrioFundo
                  HoverFill: =Self.Fill
                  PressedFill: =Self.Fill
                  BorderThickness: =0
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
            - lblDsSemPrazo:
