                  Width: =Parent.TemplateWidth - 100
                  Height: =24
                  Align: =Align.Right
                  Size: =8
                  FontWeight: =FontWeight.Semibold
                  Color: =If(ThisItem.Atrasada, corVermelho, corAmbar)
                  Text: =If(ThisItem.Atrasada, "Atrasada · ", "Vence ") & Text(ThisItem.DtPrazo, "dd/mm")
            - lblDsSemTitulo2:
                Control: Label@2.5.1
                Properties:
                  X: =12
                  Y: =34
                  Width: =Parent.TemplateWidth - 24
                  Height: =22
                  Size: =10
                  FontWeight: =FontWeight.Semibold
                  Color: =corTexto
                  Text: =Upper(ThisItem.Desc)
            - lblDsSemMeta:
                Control: Label@2.5.1
                Properties:
                  X: =12
                  Y: =56
                  Width: =Parent.TemplateWidth - 24
                  Height: =20
                  Size: =8
                  Color: =corSuave
                  Text: =ThisItem.TipoTxt & " · " & ThisItem.AreaTxt & " · " & ThisItem.SolNome
            - recDsSemSep:
                Control: Rectangle@2.3.0
                Properties:
                  X: =12
                  Y: =82
                  Width: =Parent.TemplateWidth - 24
                  Height: =1
                  Fill: =ColorValue("#EEF1F3")
            - galDsSemPessoas:
                Control: Gallery@2.15.0
                Variant: Horizontal
                Properties:
                  X: =10
                  Y: =88
                  Width: =Parent.TemplateWidth - 20
                  Height: =34
                  TemplateSize: =(Parent.TemplateWidth - 20) / Max(1, Min(3, CountRows(nfEquipe)))
                  TemplatePadding: =0
                  ShowScrollbar: =false
                  Items: =AddColumns(nfEquipe, SolID, ThisItem.ID)
                  Visible: =nfPapel = "Coordenador"
                Children:
                  - btnDsAtribuirRapido:
                      Control: Classic/Button@2.2.0
                      Properties:
                        X: =0
                        Y: =2
                        Width: =Parent.TemplateWidth - 6
                        Height: =30
                        Text: =If(ThisItem.Email = nfEu, "Eu", First(Split(ThisItem.Nome, " ")).Value)
                        Size: =9
                        Fill: =Color.White
                        HoverFill: =ColorValue("#EEF3F7")
                        PressedFill: =corPrimariaClara
                        Color: =corTexto
                        HoverColor: =corPrimariaEsc
                        BorderColor: =corBordaForte
                        BorderThickness: =1
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        OnSelect: |-
                          =With(
                              {
                                  orig: LookUp(nfSol, ID = ThisItem.SolID),
                                  pessoa: ThisItem,
                                  s: LookUp(SolicitacoesContrato, ID = ThisItem.SolID),
                                  resp: {
                                      Claims: "i:0#.f|membership|" & ThisItem.Email,
                                      DisplayName: ThisItem.Nome,
                                      Email: ThisItem.Email,
                                      Department: "",
                                      JobTitle: "",
                                      Picture: ""
                                  }
                              },
                              Patch(SolicitacoesContrato, s, {
                                  Status: {Value: If(orig.StatusTxt = "Nova", "Em andamento", orig.StatusTxt)},
                                  Responsavel: resp,
                                  ResponsavelProximaAcao: resp,
                                  PrazoAcordado: Coalesce(s.PrazoAcordado, s.PrazoSolicitado),
                                  DataAtribuicao: Now()
                              });
                              Patch(HistoricoSolicitacoes, Defaults(HistoricoSolicitacoes), {
                                  Title: "Atribuída para " & pessoa.Nome,
                                  SolicitacaoID: orig.ID,
                                  Acao: {Value: "Atribuída"},
                                  CampoAlterado: "Responsavel",
                                  ValorAnterior: "",
                                  ValorNovo: pessoa.Nome,
                                  Usuario: nfEuPessoa,
                                  DataHora: Now()
                              });
                              If(pessoa.Email <> nfEu,
                                  Office365Outlook.SendEmailV2(
                                      pessoa.Email,
                                      "Nova solicitação para você: " & orig.Codigo & " · " & orig.Desc,
                                      "<div style='font-family:Segoe UI,sans-serif;font-size:14px;color:#1F2933'>" &
                                      "<p>Olá, " & First(Split(pessoa.Nome, " ")).Value & ".</p>" &
                                      "<p>A solicitação <b>" & orig.Codigo & " · " & orig.Desc & "</b> (" & orig.TipoTxt & ", " & orig.AreaTxt &
                                      ") foi atribuída para você. Prazo: <b>" & Text(orig.DtPrazo, "dd/mm/yyyy") & "</b>.</p>" &
                                      "<p style='color:#5F6B76'>" & User().FullName & "<br>Coordenação de Contratos</p></div>"
                                  )
                              );
                              If(orig.StatusTxt = "Nova" && !IsBlank(orig.SolEmail),
                                  Office365Outlook.SendEmailV2(
                                      orig.SolEmail,
                                      "Sua solicitação foi aceita: " & orig.Codigo & " · " & orig.Desc,
                                      "<div style='font-family:Segoe UI,sans-serif;font-size:14px;color:#1F2933'>" &
                                      "<p>Olá, " & First(Split(orig.SolNome, " ")).Value & ".</p>" &
                                      "<p>Sua solicitação <b>" & orig.Codigo & " · " & orig.Desc & "</b> foi aceita e está com <b>" & pessoa.Nome &
                                      "</b>. Prazo previsto: <b>" & Text(orig.DtPrazo, "dd/mm/yyyy") & "</b>.</p>" &
                                      "<p>Você receberá outro e-mail quando ela for concluída.</p>" &
                                      "<p style='color:#5F6B76'>" & User().FullName & "<br>Coordenação de Contratos</p></div>"
                                  )
                              );
                              Refresh(SolicitacoesContrato);
                              Notify("Atribuída para " & pessoa.Nome, NotificationType.Success)
                          )
            - lblDsSemSomente:
                Control: Label@2.5.1
                Properties:
                  X: =12
                  Y: =88
                  Width: =Parent.TemplateWidth - 24
                  Height: =32
                  Size: =8
