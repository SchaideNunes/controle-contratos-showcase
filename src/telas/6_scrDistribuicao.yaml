            Width: =Parent.Width - 20
            Height: =Parent.Height - 66
            TemplateSize: =136
            TemplatePadding: =0
            Items: |-
              =SortByColumns(
                  Filter(nfSol, !Fechada && RespNome = "Sem responsável"),
                  "OrdemPrio", SortOrder.Ascending,
                  "DtPrazo", SortOrder.Ascending
              )
