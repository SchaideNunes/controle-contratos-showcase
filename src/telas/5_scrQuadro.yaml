      - txtQdMotivoPrazo:
          Control: Classic/TextInput@2.3.2
          Properties:
            X: =192
            Y: =552
            Width: =Parent.Width - 192 - 24
            Height: =36
            Default: =""
            HintText: ="Motivo da mudança *"
            Size: =10
            BorderColor: =corBordaForte
            RadiusTopLeft: =6
