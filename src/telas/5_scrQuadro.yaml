      - btnPnEnviarMsg:
          Control: Classic/Button@2.2.0
          Properties:
            X: =Parent.Width - 24 - 150
            Y: =472
            Width: =150
            Height: =34
            Text: ="Só enviar mensagem"
            Size: =9
            Fill: =Color.White
            HoverFill: =corColuna
            PressedFill: =corPrimariaClara
            Color: =corTexto
            HoverColor: =corTexto
            BorderColor: =corBordaForte
            BorderThickness: =1
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            Visible: =varQdPode && varQd.Coluna <> "Novas"
            DisplayMode: =If(IsBlank(Trim(txtQdMsg.Text)) || IsBlank(varQd.SolEmail), DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: |-
              =With({msg: Trim(txtQdMsg.Text)},
                  Office365Outlook.SendEmailV2(
                      varQd.SolEmail,
                      "Atualização da sua solicitação: " & varQd.Codigo & " · " & varQd.Desc,
                      "<div style='font-family:Segoe UI,sans-serif;font-size:14px;color:#1F2933'>" &
                      "<p>Olá, " & First(Split(varQd.SolNome, " ")).Value & ".</p>" &
                      "<p style='background:#F5F7F9;padding:12px;border-radius:6px'>" & Substitute(msg, Char(10), "<br>") & "</p>" &
                      "<p style='color:#5F6B76'>Status atual: " & varQd.StatusTxt & "<br>" & User().FullName & "<br>Coordenação de Contratos</p></div>"
                  );
                  Patch(HistoricoSolicitacoes, Defaults(HistoricoSolicitacoes), {
                      Title: "Mensagem enviada ao solicitante",
                      SolicitacaoID: varQd.ID,
                      Acao: {Value: "Comentário"},
                      Mensagem: msg,
                      Usuario: nfEuPessoa,
                      DataHora: Now()
                  })
              );
              Reset(txtQdMsg);
              Refresh(HistoricoSolicitacoes);
              Notify("Mensagem enviada para " & varQd.SolNome, NotificationType.Success)
