            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            Visible: =varQdPode && !varQd.Fechada && varQd.Coluna <> "Novas"
      - btnPnPrazo:
          Control: Classic/Button@2.2.0
          Properties:
            X: =Parent.Width - 24 - 170
            Y: =596
            Width: =170
            Height: =34
            Text: =If(nfPapel = "Coordenador", "Salvar novo prazo", "Pedir alteração")
            Size: =9
            FontWeight: =FontWeight.Semibold
            Fill: =corPrimaria
            HoverFill: =corPrimariaEsc
            PressedFill: =corPrimariaEsc
            Color: =Color.White
            HoverColor: =Color.White
            DisabledFill: =corBordaForte
            DisabledColor: =Color.White
            BorderThickness: =0
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            Visible: =varQdPode && !varQd.Fechada && varQd.Coluna <> "Novas"
            DisplayMode: |-
              =If(IsBlank(dpQdPrazo.SelectedDate) || dpQdPrazo.SelectedDate = varQd.DtPrazo || IsBlank(Trim(txtQdMotivoPrazo.Text)),
                  DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: |-
              =If(nfPapel = "Coordenador",
                  Patch(SolicitacoesContrato, LookUp(SolicitacoesContrato, ID = varQd.ID), {PrazoAcordado: dpQdPrazo.SelectedDate});
                  Patch(HistoricoSolicitacoes, Defaults(HistoricoSolicitacoes), {
                      Title: "Prazo alterado para " & Text(dpQdPrazo.SelectedDate, "dd/mm/yyyy"),
                      SolicitacaoID: varQd.ID,
                      Acao: {Value: "Prazo alterado"},
                      CampoAlterado: "PrazoAcordado",
                      ValorAnterior: Text(varQd.DtPrazo, "dd/mm/yyyy"),
                      ValorNovo: Text(dpQdPrazo.SelectedDate, "dd/mm/yyyy"),
                      Mensagem: txtQdMotivoPrazo.Text,
                      Usuario: nfEuPessoa,
                      DataHora: Now()
                  });
                  Notify("Prazo alterado", NotificationType.Success),
                  With({coord: First(Filter(nfEquipe, PapelTxt = "Coordenador"))},
                      Patch(PedidosAlteracao, Defaults(PedidosAlteracao), {
                          Title: "Prazo " & Text(varQd.DtPrazo, "dd/mm") & " → " & Text(dpQdPrazo.SelectedDate, "dd/mm"),
                          SolicitacaoID: varQd.ID,
                          Campo: {Value: "PrazoAcordado"},
                          ValorAtual: Text(varQd.DtPrazo, "dd/mm/yyyy"),
                          ValorProposto: Text(dpQdPrazo.SelectedDate, "yyyy-mm-dd"),
                          Motivo: txtQdMotivoPrazo.Text,
                          SolicitadoPor: nfEuPessoa,
                          Aprovador: {
                              Claims: "i:0#.f|membership|" & coord.Email,
                              DisplayName: coord.Nome,
                              Email: coord.Email,
                              Department: "",
                              JobTitle: "",
                              Picture: ""
                          },
                          StatusPedido: {Value: "Pendente"},
                          DataPedido: Now()
                      })
                  );
                  Notify("Pedido enviado para aprovação da coordenação", NotificationType.Success)
              );
              Reset(txtQdMotivoPrazo);
              Refresh(SolicitacoesContrato);
              Refresh(PedidosAlteracao);
              Set(varQd, LookUp(nfSol, ID = varQd.ID))
