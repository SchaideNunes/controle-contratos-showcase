            Y: =46
            Width: =Parent.Width - 48
            Height: =36
            Size: =9
            Color: =corSuave
            Text: |-
              =If(varModal = "info",
                  "A solicitação fica como ""Aguardando solicitante"" e " & galCaixaLista.Selected.SolNome & " recebe esta mensagem por e-mail.",
                  "A solicitação é encerrada como ""Recusada"" e " & galCaixaLista.Selected.SolNome & " recebe o motivo por e-mail."
              )
      - icoMotFechar:
          Control: Classic/Icon@2.5.0
          Properties:
            X: =Parent.Width - 48
            Y: =16
            Width: =30
            Height: =30
            PaddingTop: =6
            PaddingBottom: =6
            PaddingLeft: =6
            PaddingRight: =6
