            Y: =90
            Width: =Parent.Width - 48
            Height: =22
            Size: =9
            FontWeight: =FontWeight.Semibold
            Color: =corTexto
            Text: =If(varModal = "info", "O que está faltando? *", "Motivo da recusa *")
      - txtCxMotivo:
          Control: Classic/TextInput@2.3.2
          Properties:
            X: =24
            Y: =114
            Width: =Parent.Width - 48
            Height: =110
            Mode: =TextMode.MultiLine
            Default: =""
            HintText: |-
              =If(varModal = "info", "Ex.: enviar o escopo técnico revisado e a planilha de quantitativos", "Ex.: demanda já atendida pelo contrato 4500123")
            Size: =10
            BorderColor: =corBordaForte
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
      - btnMotCancelar:
          Control: Classic/Button@2.2.0
          Properties:
            X: =Parent.Width - 24 - 160 - 10 - 110
            Y: =Parent.Height - 64
            Width: =110
            Height: =40
            Text: ="Cancelar"
            Size: =10
            Fill: =Color.White
            HoverFill: =corColuna
            PressedFill: =corPrimariaClara
            Color: =corTexto
            HoverColor: =corTexto
            BorderColor: =corBordaForte
            BorderThickness: =1
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            OnSelect: =Set(varModal, "")
      - btnMotEnviar:
          Control: Classic/Button@2.2.0
          Properties:
            X: =Parent.Width - 24 - 160
            Y: =Parent.Height - 64
            Width: =160
            Height: =40
            Text: =If(varModal = "info", "Enviar pedido", "Recusar e avisar")
            Size: =10
            FontWeight: =FontWeight.Semibold
            Fill: =If(varModal = "info", corPrimaria, corVermelho)
            HoverFill: =ColorFade(Self.Fill, -15%)
            PressedFill: =ColorFade(Self.Fill, -25%)
            Color: =Color.White
            HoverColor: =Color.White
            DisabledFill: =corBordaForte
            DisabledColor: =Color.White
            BorderThickness: =0
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            DisplayMode: =If(IsBlank(Trim(txtCxMotivo.Text)), DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: |-
              =With(
                  {
                      orig: galCaixaLista.Selected,
                      s: LookUp(SolicitacoesContrato, ID = galCaixaLista.Selected.ID),
                      msg: Trim(txtCxMotivo.Text),
                      info: varModal = "info"
                  },
                  If(info,
                      Patch(SolicitacoesContrato, s, {
                          Status: {Value: "Aguardando solicitante"},
                          MotivoAguardando: Left(msg, 255),
                          ResponsavelProximaAcao: s.Solicitante
                      }),
                      Patch(SolicitacoesContrato, s, {
                          Status: {Value: "Recusada"},
                          MotivoRecusa: msg
                      })
                  );
                  Patch(HistoricoSolicitacoes, Defaults(HistoricoSolicitacoes), {
                      Title: If(info, "Pedido de mais informações ao solicitante", "Solicitação recusada"),
                      SolicitacaoID: orig.ID,
                      Acao: {Value: If(info, "Status alterado", "Recusada")},
                      CampoAlterado: "Status",
                      ValorAnterior: orig.StatusTxt,
                      ValorNovo: If(info, "Aguardando solicitante", "Recusada"),
                      Mensagem: msg,
                      Usuario: nfEuPessoa,
                      DataHora: Now()
                  });
                  If(!IsBlank(orig.SolEmail),
                      Office365Outlook.SendEmailV2(
                          orig.SolEmail,
                          If(info, "Precisamos de mais informações: ", "Solicitação recusada: ") & orig.Codigo & " · " & orig.Desc,
                          "<div style='font-family:Segoe UI,sans-serif;font-size:14px;color:#1F2933'>" &
                          "<p>Olá, " & First(Split(orig.SolNome, " ")).Value & ".</p>" &
                          If(info,
                              "<p>Para dar andamento à sua solicitação <b>" & orig.Codigo & " · " & orig.Desc & "</b>, precisamos de:</p>",
                              "<p>Sua solicitação <b>" & orig.Codigo & " · " & orig.Desc & "</b> não foi aceita pelo motivo abaixo:</p>"
                          ) &
                          "<p style='background:#F5F7F9;padding:12px;border-radius:6px'>" & Substitute(msg, Char(10), "<br>") & "</p>" &
                          If(info, "<p>Basta responder este e-mail com o que foi pedido.</p>", "") &
                          "<p style='color:#5F6B76'>" & User().FullName & "<br>Coordenação de Contratos</p></div>"
                      )
                  )
              );
              Refresh(SolicitacoesContrato);
              Refresh(HistoricoSolicitacoes);
              Notify(If(varModal = "info", "Pedido enviado ao solicitante", "Solicitação recusada"), NotificationType.Success);
              Set(varModal, "")
- conCxAtribuir:
    Control: GroupContainer@1.3.0
    Variant: ManualLayout
    Properties:
      X: =(Parent.Width - 640) / 2
      Y: =(Parent.Height - 600) / 2
      Width: =640
      Height: =600
      Fill: =Color.White
      DropShadow: =DropShadow.ExtraBold
      RadiusTopLeft: =10
      RadiusTopRight: =10
      RadiusBottomLeft: =10
      RadiusBottomRight: =10
      Visible: =varModal = "atribuir"
    Children:
      - lblAtrTitulo:
          Control: Label@2.5.1
          Properties:
            X: =24
            Y: =14
            Width: =Parent.Width - 80
            Height: =30
            Size: =14
            FontWeight: =FontWeight.Semibold
            Color: =corTexto
            Text: ="Atribuir solicitação " & galCaixaLista.Selected.Codigo
      - lblAtrSub:
          Control: Label@2.5.1
          Properties:
            X: =24
            Y: =42
            Width: =Parent.Width - 48
            Height: =22
            Size: =9
            Color: =corSuave
            Text: =galCaixaLista.Selected.Desc & "  ·  " & galCaixaLista.Selected.TipoTxt & "  ·  " & galCaixaLista.Selected.AreaTxt
      - icoAtrFechar:
          Control: Classic/Icon@2.5.0
          Properties:
            X: =Parent.Width - 48
            Y: =14
            Width: =30
            Height: =30
            PaddingTop: =6
            PaddingBottom: =6
            PaddingLeft: =6
            PaddingRight: =6
            Icon: =Icon.Cancel
            Color: =corSuave
            OnSelect: =Set(varModal, "")
      - recAtrLinha:
          Control: Rectangle@2.3.0
          Properties:
            X: =0
            Y: =72
            Width: =Parent.Width
            Height: =1
            Fill: =corBorda
      - lblAtrQuem:
          Control: Label@2.5.1
          Properties:
            X: =24
            Y: =84
            Width: =300
            Height: =22
            Size: =9
            FontWeight: =FontWeight.Semibold
            Color: =corTexto
            Text: ="Quem vai cuidar? *"
      - galAtrPessoas:
          Control: Gallery@2.15.0
          Variant: Horizontal
          Properties:
            X: =24
            Y: =108
            Width: =Parent.Width - 48
            Height: =92
            TemplateSize: =(Parent.Width - 48) / 3
            TemplatePadding: =0
            Items: |-
              =With(
                  {abertas: Filter(nfSol, !Fechada)},
                  With(
                      {t: AddColumns(nfEquipe,
                          Abertas, CountRows(Filter(abertas, RespEmail = Email)),
                          Atr, CountRows(Filter(abertas, Atrasada && RespEmail = Email))
                      )},
                      AddColumns(t, Pct, If(Max(t, Abertas) = 0, 0, Abertas / Max(t, Abertas)))
                  )
              )
          Children:
            - btnAtrPessoa:
                Control: Classic/Button@2.2.0
                Properties:
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth - 10
                  Height: =Parent.TemplateHeight
                  Text: =""
                  Fill: =If(varRespEmail = ThisItem.Email, ColorValue("#EEF3F7"), Color.White)
                  HoverFill: =If(varRespEmail = ThisItem.Email, ColorValue("#EEF3F7"), ColorValue("#F5F7F9"))
                  PressedFill: =ColorValue("#EEF3F7")
                  BorderColor: =If(varRespEmail = ThisItem.Email, corPrimaria, corBorda)
                  BorderThickness: =If(varRespEmail = ThisItem.Email, 2, 1)
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  OnSelect: =Set(varRespEmail, ThisItem.Email); Set(varRespNome, ThisItem.Nome)
            - btnAtrAvatar:
                Control: Classic/Button@2.2.0
                Properties:
                  X: =12
                  Y: =12
                  Width: =30
                  Height: =30
                  Text: =Upper(Left(ThisItem.Nome, 1) & Left(Last(Split(ThisItem.Nome, " ")).Value, 1))
                  Size: =8
                  FontWeight: =FontWeight.Bold
                  PaddingLeft: =0
                  PaddingRight: =0
                  Fill: =If(varRespEmail = ThisItem.Email, corPrimaria, corPrimariaClara)
                  HoverFill: =Self.Fill
                  PressedFill: =Self.Fill
                  Color: =If(varRespEmail = ThisItem.Email, Color.White, corPrimariaEsc)
                  HoverColor: =Self.Color
                  BorderThickness: =0
                  RadiusTopLeft: =15
                  RadiusTopRight: =15
                  RadiusBottomLeft: =15
                  RadiusBottomRight: =15
                  OnSelect: =Select(btnAtrPessoa)
            - lblAtrNome:
                Control: Label@2.5.1
                Properties:
                  X: =48
                  Y: =12
                  Width: =Parent.TemplateWidth - 66
                  Height: =30
                  Size: =10
                  FontWeight: =FontWeight.Semibold
                  Color: =corTexto
                  Text: =If(ThisItem.Email = nfEu, "Eu mesmo", ThisItem.Nome)
                  OnSelect: =Select(btnAtrPessoa)
            - lblAtrCarga:
                Control: Label@2.5.1
                Properties:
                  X: =12
                  Y: =46
                  Width: =Parent.TemplateWidth - 34
                  Height: =20
                  Size: =8
                  Color: =corTextoMedio
                  Text: =ThisItem.Abertas & " em aberto  ·  " & ThisItem.Atr & " atrasada(s)"
                  OnSelect: =Select(btnAtrPessoa)
            - recAtrTrilho:
                Control: Rectangle@2.3.0
                Properties:
                  X: =12
                  Y: =72
                  Width: =Parent.TemplateWidth - 34
                  Height: =5
                  Fill: =ColorValue("#E6EBEF")
                  OnSelect: =Select(btnAtrPessoa)
            - recAtrBarra:
                Control: Rectangle@2.3.0
                Properties:
                  X: =12
                  Y: =72
                  Width: =(Parent.TemplateWidth - 34) * ThisItem.Pct
                  Height: =5
                  Fill: =corPrimaria
                  Visible: =ThisItem.Abertas > 0
                  OnSelect: =Select(btnAtrPessoa)
            - recAtrBarraAtr:
                Control: Rectangle@2.3.0
                Properties:
                  X: =12
                  Y: =72
                  Width: =(Parent.TemplateWidth - 34) * ThisItem.Pct * If(ThisItem.Abertas = 0, 0, ThisItem.Atr / ThisItem.Abertas)
                  Height: =5
                  Fill: =corVermelho
                  Visible: =ThisItem.Atr > 0
                  OnSelect: =Select(btnAtrPessoa)
      - lblAtrPrioRot:
          Control: Label@2.5.1
          Properties:
            X: =24
            Y: =214
            Width: =320
            Height: =22
            Size: =9
            FontWeight: =FontWeight.Semibold
            Color: =corTexto
            Text: ="Prioridade"
      - galAtrPrio:
          Control: Gallery@2.15.0
          Variant: Horizontal
          Properties:
            X: =24
            Y: =238
            Width: =340
            Height: =38
            TemplateSize: =85
            TemplatePadding: =0
            ShowScrollbar: =false
            Items: =["Crítica - P0", "Alta - P1", "Média - P2", "Baixa - P3"]
          Children:
            - btnAtrPrio:
                Control: Classic/Button@2.2.0
                Properties:
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth - 4
                  Height: =36
                  Text: =First(Split(ThisItem.Value, " ")).Value
                  Size: =9
                  FontWeight: =If(varPrioSel = ThisItem.Value, FontWeight.Semibold, FontWeight.Normal)
                  Fill: |-
                    =If(varPrioSel = ThisItem.Value,
                        LookUp(nfPrioridades, Valor = ThisItem.Value).Fundo,
                        Color.White)
                  HoverFill: =Self.Fill
                  PressedFill: =Self.Fill
                  Color: |-
                    =If(varPrioSel = ThisItem.Value,
                        LookUp(nfPrioridades, Valor = ThisItem.Value).Cor,
                        corTexto)
                  HoverColor: =Self.Color
                  BorderColor: =corBordaForte
                  BorderThickness: =1
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  OnSelect: =Set(varPrioSel, ThisItem.Value)
      - lblAtrPrioInfo:
          Control: Label@2.5.1
          Properties:
            X: =24
            Y: =278
            Width: =330
            Height: =20
            Size: =8
            Color: =corSuave
            Text: ="O solicitante pediu " & galCaixaLista.Selected.PrioTxt
      - lblAtrPrazoRot:
          Control: Label@2.5.1
          Properties:
            X: =380
            Y: =214
            Width: =236
            Height: =22
            Size: =9
            FontWeight: =FontWeight.Semibold
            Color: =corTexto
            Text: ="Prazo de entrega *"
      - dpAtrPrazo:
          Control: Classic/DatePicker@2.6.0
          Properties:
            X: =380
            Y: =238
            Width: =236
            Height: =38
            DefaultDate: =galCaixaLista.Selected.DtPrazo
            Format: ="dd/mm/yyyy"
            Language: ="pt-BR"
            Size: =10
            BorderColor: =corBordaForte
      - lblAtrPrazoInfo:
          Control: Label@2.5.1
          Properties:
            X: =380
            Y: =278
            Width: =236
            Height: =20
            Size: =8
            Color: =If(dpAtrPrazo.SelectedDate <> galCaixaLista.Selected.DtPrazo, corAmbar, corSuave)
            Text: |-
              =If(dpAtrPrazo.SelectedDate <> galCaixaLista.Selected.DtPrazo,
                  "Pedido: " & Text(galCaixaLista.Selected.DtPrazo, "dd/mm/yyyy") & ". O solicitante será avisado",
                  "Igual ao solicitado")
      - lblAtrOrientRot:
          Control: Label@2.5.1
          Properties:
            X: =24
            Y: =310
            Width: =Parent.Width - 48
            Height: =22
            Size: =9
            FontWeight: =FontWeight.Semibold
            Color: =corTexto
            Text: ="Orientação para o responsável"
      - txtAtrOrientacao:
          Control: Classic/TextInput@2.3.2
          Properties:
            X: =24
            Y: =334
            Width: =Parent.Width - 48
            Height: =84
            Mode: =TextMode.MultiLine
            Default: =""
            HintText: |-
              ="Ex.: verificar se o fornecedor atual pode atender via aditivo antes de abrir concorrência"
            Size: =10
            BorderColor: =corBordaForte
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
      - chkAtrAvisaResp:
          Control: Classic/CheckBox@2.1.0
          Properties:
            X: =20
            Y: =428
            Width: =Parent.Width - 40
            Height: =34
            Default: =true
            Size: =10
            Color: =corTexto
            CheckboxBorderColor: =corBordaForte
            CheckmarkFill: =corPrimaria
            Text: ="Avisar " & Coalesce(varRespNome, "o responsável") & " por e-mail"
            Visible: =varRespEmail <> nfEu
      - chkAtrAvisaSol:
          Control: Classic/CheckBox@2.1.0
          Properties:
            X: =20
            Y: =462
            Width: =Parent.Width - 40
            Height: =34
            Default: =true
            Size: =10
            Color: =corTexto
            CheckboxBorderColor: =corBordaForte
            CheckmarkFill: =corPrimaria
            Text: ="Avisar " & galCaixaLista.Selected.SolNome & " que a demanda foi aceita"
      - recAtrRodape:
          Control: Rectangle@2.3.0
          Properties:
            X: =0
            Y: =Parent.Height - 72
            Width: =Parent.Width
            Height: =72
            Fill: =corLateral
      - btnAtrCancelar:
          Control: Classic/Button@2.2.0
          Properties:
            X: =Parent.Width - 24 - 220 - 10 - 110
            Y: =Parent.Height - 56
            Width: =110
            Height: =40
            Text: ="Cancelar"
            Size: =10
            Fill: =Color.White
            HoverFill: =corColuna
            PressedFill: =corPrimariaClara
            Color: =corTexto
            HoverColor: =corTexto
            BorderColor: =corBordaForte
            BorderThickness: =1
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            OnSelect: =Set(varModal, "")
      - btnAtrConfirmar:
          Control: Classic/Button@2.2.0
          Properties:
            X: =Parent.Width - 24 - 220
            Y: =Parent.Height - 56
            Width: =220
            Height: =40
            Text: =If(IsBlank(varRespEmail), "Escolha o responsável", "Atribuir para " & If(varRespEmail = nfEu, "mim", First(Split(varRespNome, " ")).Value))
            Size: =10
            FontWeight: =FontWeight.Semibold
            Fill: =corPrimaria
            HoverFill: =corPrimariaEsc
            PressedFill: =corPrimariaEsc
            Color: =Color.White
            HoverColor: =Color.White
            DisabledFill: =corBordaForte
            DisabledColor: =Color.White
            BorderThickness: =0
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            DisplayMode: =If(IsBlank(varRespEmail) || IsBlank(dpAtrPrazo.SelectedDate), DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: |-
              =With(
                  {
                      orig: galCaixaLista.Selected,
                      s: LookUp(SolicitacoesContrato, ID = galCaixaLista.Selected.ID),
                      resp: {
                          Claims: "i:0#.f|membership|" & varRespEmail,
                          DisplayName: varRespNome,
                          Email: varRespEmail,
                          Department: "",
                          JobTitle: "",
                          Picture: ""
                      },
                      prazoMudou: dpAtrPrazo.SelectedDate <> galCaixaLista.Selected.DtPrazo,
                      prioMudou: varPrioSel <> galCaixaLista.Selected.PrioTxt
                  },
                  Patch(SolicitacoesContrato, s, {
                      Status: {Value: "Em andamento"},
                      Responsavel: resp,
                      ResponsavelProximaAcao: resp,
                      Prioridade: {Value: varPrioSel},
                      PrazoAcordado: dpAtrPrazo.SelectedDate,
                      Orientacao: txtAtrOrientacao.Text,
                      DataAtribuicao: Now()
                  });
                  Patch(HistoricoSolicitacoes, Defaults(HistoricoSolicitacoes), {
                      Title: "Aceita e atribuída para " & varRespNome,
                      SolicitacaoID: orig.ID,
                      Acao: {Value: "Atribuída"},
                      CampoAlterado: "Responsavel",
                      ValorAnterior: "",
                      ValorNovo: varRespNome,
                      Mensagem: txtAtrOrientacao.Text,
                      Usuario: nfEuPessoa,
                      DataHora: Now()
                  });
                  If(prazoMudou,
                      Patch(HistoricoSolicitacoes, Defaults(HistoricoSolicitacoes), {
                          Title: "Prazo ajustado para " & Text(dpAtrPrazo.SelectedDate, "dd/mm/yyyy"),
                          SolicitacaoID: orig.ID,
                          Acao: {Value: "Prazo alterado"},
                          CampoAlterado: "PrazoAcordado",
                          ValorAnterior: Text(orig.DtPrazo, "dd/mm/yyyy"),
                          ValorNovo: Text(dpAtrPrazo.SelectedDate, "dd/mm/yyyy"),
                          Usuario: nfEuPessoa,
                          DataHora: Now()
                      })
                  );
                  If(prioMudou,
                      Patch(HistoricoSolicitacoes, Defaults(HistoricoSolicitacoes), {
                          Title: "Prioridade ajustada para " & varPrioSel,
                          SolicitacaoID: orig.ID,
                          Acao: {Value: "Prioridade alterada"},
                          CampoAlterado: "Prioridade",
                          ValorAnterior: orig.PrioTxt,
                          ValorNovo: varPrioSel,
                          Usuario: nfEuPessoa,
                          DataHora: Now()
                      })
                  );
                  If(chkAtrAvisaResp.Value && varRespEmail <> nfEu,
                      Office365Outlook.SendEmailV2(
                          varRespEmail,
                          "Nova solicitação para você: " & orig.Codigo & " · " & orig.Desc,
                          "<div style='font-family:Segoe UI,sans-serif;font-size:14px;color:#1F2933'>" &
                          "<p>Olá, " & First(Split(varRespNome, " ")).Value & ".</p>" &
                          "<p>A solicitação abaixo foi atribuída para você:</p>" &
                          "<table style='border-collapse:collapse'>" &
                          "<tr><td style='padding:4px 16px 4px 0;color:#5F6B76'>Código</td><td>" & orig.Codigo & "</td></tr>" &
                          "<tr><td style='padding:4px 16px 4px 0;color:#5F6B76'>Descrição</td><td>" & orig.Desc & "</td></tr>" &
                          "<tr><td style='padding:4px 16px 4px 0;color:#5F6B76'>Tipo</td><td>" & orig.TipoTxt & "</td></tr>" &
                          "<tr><td style='padding:4px 16px 4px 0;color:#5F6B76'>Solicitante</td><td>" & orig.SolNome & " (" & orig.AreaTxt & ")</td></tr>" &
                          "<tr><td style='padding:4px 16px 4px 0;color:#5F6B76'>Prioridade</td><td>" & varPrioSel & "</td></tr>" &
                          "<tr><td style='padding:4px 16px 4px 0;color:#5F6B76'>Prazo</td><td>" & Text(dpAtrPrazo.SelectedDate, "dd/mm/yyyy") & "</td></tr>" &
                          "</table>" &
                          If(IsBlank(Trim(txtAtrOrientacao.Text)), "",
                              "<p><b>Orientação:</b></p><p style='background:#F5F7F9;padding:12px;border-radius:6px'>" &
                              Substitute(txtAtrOrientacao.Text, Char(10), "<br>") & "</p>") &
                          "<p style='color:#5F6B76'>" & User().FullName & "<br>Coordenação de Contratos</p></div>"
                      )
                  );
                  If(chkAtrAvisaSol.Value && !IsBlank(orig.SolEmail),
                      Office365Outlook.SendEmailV2(
                          orig.SolEmail,
                          "Sua solicitação foi aceita: " & orig.Codigo & " · " & orig.Desc,
                          "<div style='font-family:Segoe UI,sans-serif;font-size:14px;color:#1F2933'>" &
                          "<p>Olá, " & First(Split(orig.SolNome, " ")).Value & ".</p>" &
                          "<p>Sua solicitação <b>" & orig.Codigo & " · " & orig.Desc & "</b> foi aceita e está com <b>" & varRespNome & "</b>.</p>" &
                          "<p>Prazo previsto: <b>" & Text(dpAtrPrazo.SelectedDate, "dd/mm/yyyy") & "</b>" &
                          If(prazoMudou, " (você havia pedido " & Text(orig.DtPrazo, "dd/mm/yyyy") & ")", "") & "</p>" &
                          "<p>Você receberá outro e-mail quando ela for concluída.</p>" &
                          "<p style='color:#5F6B76'>" & User().FullName & "<br>Coordenação de Contratos</p></div>"
                      )
                  )
              );
              Refresh(SolicitacoesContrato);
              Refresh(HistoricoSolicitacoes);
              Notify("Solicitação atribuída para " & varRespNome, NotificationType.Success);
              Set(varModal, "")
